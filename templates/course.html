<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>-[ output title ]-</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2em auto; padding: 0 1em; color: #222; }
        h1 { border-bottom: 1px solid #ccc; padding-bottom: 0.3em; }
        h2 { margin-top: 1.5em; text-transform: capitalize; color: #444; }
        ul { list-style: none; padding-left: 0; }
        li { padding: 0.25em 0; }
        a { color: #06c; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .empty { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <h1>-[ output title ]-</h1>
    -[ for group in groups ]-
    <section>
        -[ if group.name ]-
        <h2>-[ output group.name ]-</h2>
        -[ endif ]-
        <ul>
        -[ for file in group.files ]-
            <li><a href="-[ output file.href ]-">-[ output file.name ]-</a></li>
        -[ endfor ]-
        </ul>
    </section>
    -[ endfor ]-
</body>
</html>
