<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>-[ output title ]-</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2em auto; padding: 0 1em; color: #222; }
        h1 { border-bottom: 1px solid #ccc; padding-bottom: 0.3em; }
        h2 { margin-top: 1.5em; color: #444; }
        ul { list-style: none; padding-left: 0; }
        li { padding: 0.25em 0; }
        a { color: #06c; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .subtle { color: #888; }
    </style>
</head>
<body>
    <h1>-[ output title ]-</h1>
    <p class="subtle"><a href="https://github.com/Redstone-D/note_server">Source code</a></p>
    <h2>Courses</h2>
    <ul>
    -[ for project in projects ]-
        <li><a href="/-[ output project.id ]-">-[ output project.title ]-</a></li>
    -[ endfor ]-
    </ul>
</body>
</html>
